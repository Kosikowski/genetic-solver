# .github/workflows/windows.yml
# CI for Swift packages on Windows.

name: Windows CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets the Release workflow run these tests before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the runs for its earlier pushes.
# Other runs (pushes to main, tags, calls from the Release workflow) each get
# a group of their own, so they are never cancelled or held back.
concurrency:
  group: windows-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025
    name: Build and Test (Windows)
    strategy:
      matrix:
        swift-version: [6.1.2]

    steps:
      - uses: actions/checkout@v7

      - name: Install Swift
        uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Verify Swift installation
        run: |
          swift --version
          swift build --help
        shell: pwsh

      - name: Build
        run: swift build -v
        shell: pwsh

      - name: Run tests
        run: swift test -v
        shell: pwsh

  build-windows-release:
    runs-on: windows-2025
    name: Build and Test (Windows Release)
    strategy:
      matrix:
        swift-version: [6.1.2]

    steps:
      - uses: actions/checkout@v7

      - name: Install Swift
        uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Verify Swift installation
        run: |
          swift --version
          swift build --help
        shell: pwsh

      - name: Build Release
        run: swift build -c release -v
        shell: pwsh

      - name: Test Release
        run: swift test -c release -v
        shell: pwsh
