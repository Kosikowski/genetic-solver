# .github/workflows/linux.yml
# CI for Swift packages on Linux.

name: Linux CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets the Release workflow run these tests before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the runs for its earlier pushes.
# Other runs (pushes to main, tags, calls from the Release workflow) each get
# a group of their own, so they are never cancelled or held back.
concurrency:
  group: linux-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The jobs run in the official Swift images, the same ones
# scripts/test-linux.sh uses locally. That way they don't depend on the
# Ubuntu version of ubuntu-latest (Swift 5.9 was never released for Ubuntu
# 24.04 or later) or on a toolchain installer.
jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build and Test (Linux)
    container: swift:${{ matrix.swift-version }}
    strategy:
      matrix:
        swift-version: ['5.9', '6.1.2']

    steps:
      - uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  build-linux-release:
    runs-on: ubuntu-latest
    name: Build and Test (Linux Release)
    container: swift:${{ matrix.swift-version }}
    strategy:
      matrix:
        swift-version: ['5.9', '6.1.2']

    steps:
      - uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Build Release
        run: swift build -c release -v

      - name: Test Release
        run: swift test -c release -v

  # This package and its tests use the Swift 5 language mode, which doesn't
  # enforce Sendable. A small client in the Swift 6 language mode catches
  # problems that only Swift 6 users would see.
  swift6-client:
    runs-on: ubuntu-latest
    name: Swift 6 Client
    container: swift:6.1.2

    steps:
      - uses: actions/checkout@v6

      - name: Build and run a Swift 6 client of this package
        run: ./scripts/test-swift6-client.sh
