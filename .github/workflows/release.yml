# .github/workflows/release.yml
# Publishes a GitHub release for a version tag (v<semantic version>, for
# example v1.2.0) after the Apple, Linux and Windows tests pass.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # Fails within seconds for a mistyped tag, before the long test jobs start.
  check-tag:
    name: Check Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is v<semantic version>
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: ./scripts/release-notes.sh "$TAG" "$REPOSITORY"

  apple:
    needs: check-tag
    uses: ./.github/workflows/swift.yml

  linux:
    needs: check-tag
    uses: ./.github/workflows/linux.yml

  windows:
    needs: check-tag
    uses: ./.github/workflows/windows.yml

  release:
    name: Create Release
    needs: [apple, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # release-notes.sh rejects tags that aren't v<semantic version> and
      # writes an installation snippet without the "v", which SwiftPM needs.
      # GitHub's generated notes (merged pull requests) follow it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="$(./scripts/release-notes.sh "$TAG" "$REPOSITORY")"
          prerelease=()
          if [[ "${TAG%%+*}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "Release $TAG" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}"
