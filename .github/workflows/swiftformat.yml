# .github/workflows/swiftformat.yml
# SwiftFormat CI for code formatting consistency

name: SwiftFormat

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a pull request cancels the runs for its earlier pushes.
# Other runs (pushes to main, tags, calls from the Release workflow) each get
# a group of their own, so they are never cancelled or held back.
concurrency:
  group: swiftformat-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swiftformat:
    runs-on: ubuntu-latest
    name: SwiftFormat Check

    steps:
      - uses: actions/checkout@v7

      # Install the SwiftFormat version pinned in .pre-commit-config.yaml so CI
      # formats code exactly like the local pre-commit hook.
      - name: Install SwiftFormat
        run: |
          ./scripts/install-swiftformat.sh "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      # The script exits with a non-zero code when any file needs formatting,
      # which fails this step and lists every violation in the log. It checks
      # one file at a time: with all files at once, SwiftFormat's Linux build
      # on these runners hits its time limit ("rule timed out").
      - name: Check SwiftFormat
        run: ./scripts/swiftformat-each.sh --lint
