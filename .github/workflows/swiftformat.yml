# .github/workflows/swiftformat.yml
# SwiftFormat CI for code formatting consistency

name: SwiftFormat

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  swiftformat:
    runs-on: macos-14
    name: SwiftFormat Check

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for SwiftFormat to work properly

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1.2"

      - name: Clean build directory
        run: rm -rf .build

      # Install the SwiftFormat version pinned in .pre-commit-config.yaml so CI
      # formats code exactly like the local pre-commit hook.
      - name: Install SwiftFormat
        run: |
          version="$(./scripts/swiftformat-version.sh)"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${version}/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Show SwiftFormat version
        run: swiftformat --version

      # SwiftFormat exits with a non-zero code when any file needs formatting,
      # which fails this step and lists every violation in the log.
      - name: Check SwiftFormat
        run: |
          swiftformat --lint --config .swiftformat Sources/ Tests/
