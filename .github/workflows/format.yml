# .github/workflows/format.yml
# Auto-format code and create PRs for formatting fixes

name: Auto Format

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: macos-14
    name: Auto Format Code

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1.2"

      - name: Clean build directory
        run: rm -rf .build

      # Install the SwiftFormat version pinned in .pre-commit-config.yaml so CI
      # formats code exactly like the local pre-commit hook.
      - name: Install SwiftFormat
        run: |
          version="$(./scripts/swiftformat-version.sh)"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${version}/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Show SwiftFormat version
        run: swiftformat --version

      - name: Check current formatting
        id: check-formatting
        # SwiftFormat exits with 0 when everything is formatted, 1 when some
        # files need formatting, and another non-zero code when it could not run.
        run: |
          status=0
          swiftformat --lint --config .swiftformat Sources/ Tests/ || status=$?
          case $status in
            0) echo "needs-formatting=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "needs-formatting=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "SwiftFormat failed with exit code $status"; exit "$status" ;;
          esac

      - name: Format code
        if: steps.check-formatting.outputs.needs-formatting == 'true'
        run: |
          swiftformat --config .swiftformat Sources/ Tests/

      - name: Create Pull Request
        if: steps.check-formatting.outputs.needs-formatting == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-format code with SwiftFormat"
          title: "style: auto-format code with SwiftFormat"
          body: |
            This PR automatically formats the code using SwiftFormat.

            Changes made:
            - Applied SwiftFormat rules from `.swiftformat` configuration
            - Formatted all Swift files in `Sources/` and `Tests/` directories

            This is an automated formatting PR to maintain code style consistency.
          branch: auto-format
          delete-branch: true
          labels: |
            automated
            formatting
