# .github/workflows/swift.yml
# Builds and tests the package on every supported Apple platform.

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets the Release workflow run these tests before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  apple:
    name: ${{ matrix.platform }} (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS, visionOS]
        # Each Xcode version ships one Swift version, so selecting Xcode
        # selects the compiler. Keep these in step with the Linux and Windows
        # workflows: Xcode 15.2 has Swift 5.9.2 and Xcode 16.4 has Swift 6.1.2.
        xcode: ['15.2', '16.4']
        include:
          - xcode: '15.2'
            runner: macos-14
          - xcode: '16.4'
            runner: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # macOS runs `swift test`; iOS, tvOS and visionOS run `xcodebuild test`
      # on a simulator that the selected Xcode supports.
      - name: Build and test (${{ matrix.platform }})
        run: ./scripts/test-apple.sh ${{ matrix.platform }}
